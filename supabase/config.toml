project_id = "sasa-futbol"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = false

[auth]
enabled = true
site_url = "https://sasa-f.com/"
additional_redirect_urls = [
  "https://sasa-f.com/",
  "https://vetmaster.github.io/sporx-futbol-okulu/",
  "http://127.0.0.1:8765",
  "http://localhost:8765"
]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.hostinger.com"
port = 465
user = "bilgi@sasa-f.com"
pass = "env(SMTP_PASS)"
admin_email = "bilgi@sasa-f.com"
sender_name = "SASA-F"

[auth.email.template.invite]
subject = "SASA-F hesabınıza davet edildiniz"
content_path = "./supabase/templates/invite.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.send-push-notification]
verify_jwt = false

[functions.send-subscription-renewal-reminders]
verify_jwt = false

[functions.invite-guardian]
verify_jwt = false

[functions.invite-school-admin]
verify_jwt = false
